[package]
name = "mcp-http-spike"
version = "0.1.0"
edition = "2021"
# The probe (src/bin/probe_noauth.rs) is a diagnostic: it separates "transport
# broken" from "auth rejected" by hitting a public no-auth MCP server. Without
# this key, adding it silently broke bare `cargo run` for the real spike.
default-run = "mcp-http-spike"

[dependencies]
anyhow = "1"
rmcp = { version = "3", features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }