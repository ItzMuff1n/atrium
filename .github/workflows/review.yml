name: review

# The AI reviewer. One job, one required check.
#
# What it does NOT do: it does not replace `test-guard` or the tests. It reads
# the diff and the body of every issue the PR closes, asks a model whether the
# change is legitimate, and fails the job when the answer is "fail". It is a
# second opinion on the SHAPE of a change -- weakened assertions, out-of-scope
# edits, source edited to satisfy mutation testing, workarounds, secrets -- not
# a substitute for the tests being right.
#
# Why it can fail a PR at all: the human owner does not read code, so a change
# that weakens a test to make CI green has no other obstacle. `test-guard`
# catches some of that mechanically; this catches the cases a diff comparison
# cannot express, and it is the only check here that reads the linked issue and
# asks whether the diff is about it.
#
# The judgement is a model's, so it is treated as fallible in both directions:
# a "fail" is a claim to be argued with in the PR thread, not a verdict on the
# author. What is NOT fallible is the plumbing -- a missing secret, an
# unparseable answer, or an oversized diff all fail the check (see
# scripts/review-pr.py), because "I could not review this" must never render as
# a pass.

on:
  pull_request:

# Least privilege: reading the PR and its linked issues needs `contents: read`
# and `pull-requests: read`; posting the findings comment needs
# `pull-requests: write`. `issues: read` is required for the linked-issue
# bodies, which are part of the scope the model is asked to judge.
permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    name: ai review
    runs-on: ubuntu-latest

    steps:
      # v7.0.1, matching check.yml and mutants.yml: v4 declares node20 and
      # GitHub is retiring that runtime.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # python3 and gh are both preinstalled on ubuntu-latest; the script needs
      # nothing from the network except the model endpoint itself.
      - name: Show the versions actually in use
        run: |
          python3 --version
          gh --version | head -1

      - name: Review the pull request
        env:
          # The secret is passed as an env var, never interpolated into a shell
          # command, so it cannot end up in the log or in a process argv.
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python3 scripts/review-pr.py --pr "$PR_NUMBER"
          rc=$?
          set -e
          case "$rc" in
            0) echo "review passed" ;;
            1) echo "::error::the AI review did not pass -- see the comment on this PR"; exit 1 ;;
            *) echo "::error::the reviewer exited $rc, which is not a verdict it produces"; exit 1 ;;
          esac
