name: check

# Two jobs.
#
# `check` runs on every push and every pull request. This is the same check the
# pre-commit hook runs, so a green commit locally and a green run here mean the
# same thing -- and a commit made with --no-verify is caught here instead of
# being taken on trust.
#
# `test-guard` runs on pull requests only. It exists because `check` answers
# "do the tests pass?", which a change can also make true by deleting or
# weakening the tests instead of fixing the code. `test-guard` compares the PR
# against its base branch and refuses a pull request that declares fewer tests,
# that removes or changes an assertion, or that adds #[ignore]. See
# scripts/test-guard.sh for what it does and does not catch.

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt, build, test, clippy
    runs-on: ubuntu-latest

    steps:
      # v7.0.1, not v4: v4 declares `using: node20` and GitHub is retiring the
      # Node 20 runtime, which printed a deprecation warning on every run.
      # v7.0.1 declares node24. Bumped 18 Sep 2026.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # rustup is preinstalled on GitHub's ubuntu-latest runners. This step
      # installs whatever rust-toolchain.toml names, together with the
      # components it lists (rustfmt, clippy) -- the file is the single source of
      # the version, so CI and the developer machine cannot drift. Verified
      # locally: a bare cargo invocation in a directory holding this file
      # auto-installs that exact toolchain.
      - name: Install the pinned toolchain
        run: rustup show

      - name: Show the versions actually in use
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # v6.1.0, not v4, for the same Node 20 reason as checkout above. v6.1.0
      # declares node24.
      #
      # ~/.cargo/registry and target/ are cached. ~/.cargo/bin/ is NOT, and that
      # is load-bearing rather than a tidy-up: caching it made this step's install
      # below work on the first run and break on every run after it. Restoring
      # ~/.cargo/bin brings back the cargo-deny binary without the tracking file
      # cargo uses to know a package is installed, and cargo then has a binary it
      # cannot identify -- it will neither skip the install nor overwrite the
      # file. The step dies with "binary `cargo-deny` already exists in
      # destination", exit 101, before the check runs. The install reads the
      # registry, never a staged binary, so the registry is what makes it cheap.
      - name: Cache cargo registry and build output
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Pinned to an exact version, not `cargo install cargo-deny`, so the gate
      # cannot change under the project without an edit here. --locked so the
      # tool's own dependency resolution cannot drift either. Pinned to the
      # version installed and run locally, so a green local run and a green CI
      # run are the same check. See scripts/check.sh step 5.
      #
      # `--force` is load-bearing, not hygiene. `cargo install` REFUSES to
      # overwrite an existing binary in its destination ("binary `cargo-deny`
      # already exists in destination", exit 101), so any cargo-deny already
      # present -- from a runner image, or from a cache saved while
      # ~/.cargo/bin was still in the path list above -- would make this step die
      # here and take the whole required check with it.
      #
      # This is latent today, not live: the archive that currently satisfies this
      # key does not contain the binary, which is why the run on main downloads
      # and compiles cargo-deny from scratch every time (observed on run
      # 35397574653). It becomes live the moment a key change saves an archive
      # that does contain one. Reproduced locally on 19 Sep 2026 in a throwaway
      # CARGO_HOME holding bin/cargo-deny and no .crates.toml: exit 101 without
      # --force, exit 0 with it.
      - name: Install cargo-deny (pinned)
        run: cargo install --locked --force cargo-deny --version 0.20.2

      - name: Show the cargo-deny version actually in use
        run: cargo deny --version

      - name: Run the check
        run: bash scripts/check.sh

  test-guard:
    name: test-guard
    runs-on: ubuntu-latest
    # Only a pull request has a base branch to compare against, so this job is
    # meaningless on a push and does not run there.
    if: github.event_name == 'pull_request'

    steps:
      # fetch-depth: 0 is required: the guard compares the PR head against the
      # base branch and needs the merge base, which a shallow clone does not
      # have. Without it the comparison would silently have nothing to look at,
      # and the guard is written to fail in that case rather than pass.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Make the base branch available
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git rev-parse "origin/${{ github.base_ref }}"

      - name: Install the pinned toolchain
        run: rustup show

      # ~/.cargo/bin/ is excluded here for the same reason as the check job
      # above: restoring it brings back a binary without cargo's tracking file,
      # which is what breaks a `cargo install` step. This job installs no binary
      # of its own, and it does not save this cache -- on a pull request the key
      # was already written by the check job's push run, so this job's log says
      # "Cache hit occurred on the primary key ... not saving" (observed on run
      # 35397574653). The exclusion is dormant today; it is here so this file
      # cannot grow the trap back if this job ever runs with a cold key.
      - name: Cache cargo registry and build output
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run the test guard
        run: bash scripts/test-guard.sh
