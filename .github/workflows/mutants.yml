name: mutants

# Weekly mutation testing.
#
# What it is for: cargo-mutants deliberately breaks the code in small ways --
# flips a comparison, deletes a !, replaces a return value -- and runs the test
# suite after each break. If the suite still passes, that break was invisible to
# the tests, which means the code has a hole no test covers. Those are the
# results this workflow collects and files as an issue.
#
# Read this before changing anything here:
#
# * It is deliberately NOT a required check. Nothing about it gates a pull
#   request, and it has no `pull_request` trigger at all. A mutation run over the
#   whole scope takes minutes and would tell every PR author about pre-existing
#   holes in code they did not touch. It runs weekly and files findings.
#
# * The scope is `crates/resolver`, `crates/fileops` and `crates/shell`, and the
#   exclusions live in `.cargo/mutants.toml`. Read the comment there before
#   narrowing or widening it -- in particular the binary-target exclusion, which
#   is deliberate and is what makes a weekly result actionable rather than noise.
#
# * This workflow carries the same reporting discipline as fuzz.yml: `gh` needs
#   GH_TOKEN, and a report that fails to file FAILS THE STEP. A mutation run
#   whose findings are silently dropped looks exactly like a clean week.

on:
  # 04:53 UTC on Sunday. Deliberately off the hour and off the half hour:
  # GitHub queues scheduled runs at busy times and can delay them by many
  # minutes, so an odd minute costs nothing and avoids the worst of the queue.
  # Sunday at 04:xx shares no slot with anything else this repo runs: `fuzz.yml`
  # is daily at 03:17, `check.yml` runs per push, and Dependabot opens its update
  # PRs weekly on its own schedule.
  schedule:
    - cron: '53 4 * * 0'

  # Manual runs. No inputs: unlike the fuzzer, a mutation run has a fixed amount
  # of work to do -- every mutant in scope, once -- so there is nothing for a
  # caller to tune.
  workflow_dispatch:

# `issues: write` is the only permission this needs: it reads the code and
# writes one issue. Nothing here can push, publish a package, or touch a
# release.
permissions:
  issues: write

jobs:
  # A dry run on every dispatch and schedule, so the log always opens with the
  # exact scope and the exact mutant count. Costs about two minutes and turns
  # "162 missed" into a number that can be compared against last week's without
  # guessing what was in scope.
  plan:
    name: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # rustup is preinstalled on the runner. This installs whatever
      # rust-toolchain.toml names, so CI tests under the compiler the project
      # pins -- the same reason check.yml does it.
      - name: Install the pinned toolchain
        run: rustup show

      - name: Restore the cargo registry
        id: cargo-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: mutants-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            mutants-cargo-${{ runner.os }}-

      # Pinned to the exact version installed and run locally, and --force for
      # the same reason fuzz.yml and check.yml use it: `cargo install` refuses to
      # overwrite a binary already in its destination, so a binary arriving from
      # a runner image or a future cache edit must not be able to wedge the step.
      # See check.yml's install step for the full explanation.
      #
      # ~/.cargo/bin is deliberately NOT cached anywhere in this file: restoring
      # it brings back a binary without cargo's tracking file, which is the
      # combination that makes `cargo install` fail outright.
      - name: Install cargo-mutants (pinned)
        run: cargo install --locked --force cargo-mutants --version 27.1.0

      - name: Show the versions actually in use
        run: |
          cargo mutants --version
          rustc --version

      # --list builds and tests nothing, so this is cheap. cargo-mutants'
      # console output is documented as deterministic, so the count here is
      # comparable between runs.
      - name: List the mutants in scope
        run: |
          cargo mutants --list -p atrium-resolver -p atrium-fileops -p atrium-shell \
            | tee mutants-list.txt
          echo "mutants in scope: $(wc -l < mutants-list.txt)"

      - name: Save the cargo registry
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: mutants-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  # One job per shard. Sharding is by mutant index, so 4 shards split the work
  # 0,4,8,... / 1,5,9,... -- every mutant is tested by exactly one shard, and the
  # runs partition the work rather than repeating it. All shards must use the
  # same denominator and the same filters or the split means nothing, which is
  # why the flags are written once in the env block below.
  #
  # Locally the whole scope took about a minute of wall time with 4 jobs on a
  # 28-core machine; sharding exists because CI runners are weaker and the
  # repository will grow, and 4 keeps the weekly job far inside the 60-minute
  # ceiling. Raising the shard count here is the only change needed if a shard
  # ever gets slow.
  mutants:
    name: mutants ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      # Not fail-fast: a shard that finds uncovered code is a RESULT, not an
      # error, and the other shards still have useful work to report. Killing
      # them because one finished "red" would throw away findings.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    env:
      # `--jobs 4` is the parallelism INSIDE one shard (how many mutants that
      # shard tests at once); the matrix is the parallelism ACROSS shards. The
      # runner has 4 cores, and cargo-mutants uses a jobserver so the two do not
      # fight over the build.
      #
      # `--baseline=run` is left at the default deliberately. It runs the suite
      # once against unmodified code first, which is what makes the results
      # meaningful: if the suite is already failing, cargo-mutants reports that
      # (exit 4) instead of blaming a mutation for it.
      MUTANTS_ARGS: >-
        -p atrium-resolver -p atrium-fileops -p atrium-shell
        --jobs 4
        --shard ${{ matrix.shard }}/4

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install the pinned toolchain
        run: rustup show

      - name: Restore the cargo registry
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: mutants-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            mutants-cargo-${{ runner.os }}-

      - name: Install cargo-mutants (pinned)
        run: cargo install --locked --force cargo-mutants --version 27.1.0

      # exit 2 means "some mutants were not covered by tests" -- a finding, and
      # the expected outcome of a useful run. exit 3 (timeouts) and exit 4
      # (baseline already failing) mean the run did not produce a trustworthy
      # answer at all, so they stay hard failures. 0 and 2 are successes.
      #
      # exit 0 also covers a shard that was assigned NO mutants (observed
      # 19 Sep 2026: 5 mutants over 4 shards distribute 2/2/1/0, and the empty
      # shard prints "WARN No mutants found under the active filters" and exits
      # 0). That shard still creates a mutants.out directory, but with no
      # outcomes.json in it -- the report job is written to expect exactly that
      # rather than treating it as a shard that died.
      #
      # `set +e` stops the expected exit 2 from failing the step before the
      # results have been collected.
      - name: Run this shard
        run: |
          set +e
          cargo mutants $MUTANTS_ARGS 2>&1 | tee mutants-shard-${{ matrix.shard }}.log
          rc=${PIPESTATUS[0]}
          echo "cargo-mutants exit code: $rc"
          case "$rc" in
            0) echo "this shard is clean: either every viable mutant was caught, or the shard was assigned none" ;;
            2) echo "uncovered mutants found in this shard -- a finding, not a failure" ;;
            *) echo "::error::cargo-mutants exit $rc: the run did not produce a trustworthy result"; exit "$rc" ;;
          esac

      # Each shard runs on its own runner, so their mutants.out directories
      # cannot collide. The upload names the artifact per shard instead of
      # wrapping it in a shard-named directory: wrapping it produced
      # `mutants-shard-0/mutants-shard-0/mutants.out/...` once the artifact was
      # downloaded again, and the reporter's path glob then found nothing. Both
      # the wrapper and the one-level-deep assumption are gone.
      - name: Keep this shard's results
        if: always()
        run: |
          if [ -f mutants.out/outcomes.json ]; then
            echo "results present for this shard"
            python3 -c "import json;d=json.load(open('mutants.out/outcomes.json'));print('total=%s missed=%s caught=%s timeout=%s unviable=%s' % (d['total_mutants'],d['missed'],d['caught'],d['timeout'],d['unviable']))"
          else
            echo "this shard produced no outcomes.json -- either it was assigned no mutants, or it failed before testing"
          fi

      # if-no-files-found is warn, not error: a shard that failed before
      # producing results should be reported by its log, not by a confusing
      # second failure about a missing artifact.
      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            mutants.out/
            mutants-shard-${{ matrix.shard }}.log
          if-no-files-found: warn

  # Collects every shard's findings into one list and files it. Split from the
  # shard jobs so exactly one writer decides whether to open an issue or comment
  # on an existing one -- four shards each filing their own issue would produce
  # four issues for one night's work.
  report:
    name: report
    runs-on: ubuntu-latest
    needs: mutants
    # Runs even when a shard failed, so a real finding is never masked by an
    # unrelated shard error.
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # This job needs no toolchain and no registry cache -- only the shards'
      # artifacts. No merge-multiple: each artifact keeps its own directory,
      # which is how the script tells the shards apart and notices a shard that
      # produced nothing.
      - name: Download every shard's results
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: mutants-shard-*
          path: mutants-results

      - name: Show what arrived
        run: |
          find mutants-results -maxdepth 2 -type d | sort
          find mutants-results -name outcomes.json | sort

      # GH_TOKEN is required even though the workflow declares issues: write.
      # Without it `gh` refuses to do anything and the issue is silently never
      # filed -- the defect PR #15 fixed in fuzz.yml.
      - name: Report the findings as an issue
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          python3 scripts/report-mutants.py \
            --results mutants-results \
            --expected-shards 0,1,2,3 \
            --run-url "$RUN_URL"
          rc=$?
          if [ "$rc" -ne 0 ] || [ ! -s issue-status.txt ]; then
            echo "::error::the mutation report did not complete; see the output above"
            exit 1
          fi
          echo "report: $(cat issue-status.txt)"

      - name: Summarise
        run: |
          if [ -s issue-status.txt ]; then
            echo "- report: $(cat issue-status.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s mutants-summary.txt ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Missed mutants" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat mutants-summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Uploaded after the report has been attempted, so the artifact exists
      # even when filing the issue failed.
      - name: Upload the collected findings
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutants-report
          path: |
            mutants-results/
            mutants-summary.txt
            issue-status.txt
          if-no-files-found: warn
