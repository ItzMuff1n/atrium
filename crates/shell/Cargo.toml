[package]
name = "atrium-shell"
version = "0.1.0"

# Cargo would let this crate be published to crates.io; `publish = false` says it
# never will be. This is load-bearing for the supply-chain gate, not bookkeeping:
# cargo-deny's `licenses.private.ignore` only exempts a workspace member from the
# licence check when the member is not published. Without this line the five
# Atrium crates are reported as "unlicensed" (they legitimately carry no SPDX
# expression -- see deny.toml), and the only way to silence that would be to
# switch the `unlicensed` lint off for every crate, including the third-party
# ones the check exists to catch. With it, the exemption is scoped to these five.
publish = false
edition = "2021"

[dependencies]
atrium-resolver = { path = "../resolver" }
