[package]
name = "atrium-resolver"
version = "0.1.0"

# Cargo would let this crate be published to crates.io; `publish = false` says it
# never will be. This is load-bearing for the supply-chain gate, not bookkeeping:
# cargo-deny's `licenses.private.ignore` only exempts a workspace member from the
# licence check when the member is not published. Without this line the five
# Atrium crates are reported as "unlicensed" (they legitimately carry no SPDX
# expression -- see deny.toml), and the only way to silence that would be to
# switch the `unlicensed` lint off for every crate, including the third-party
# ones the check exists to catch. With it, the exemption is scoped to these five.
publish = false
edition = "2021"

# Dependencies: NONE. std only, by design (brief §8.1).
#
# dev-dependencies: one, and it is the repo's FIRST external dependency. It is
# test-only — it never enters the product build, and `cargo build` for the
# workspace still resolves to the five Atrium crates and nothing else. It is
# pinned to an exact version rather than a range so the property tests cannot
# change behaviour without a deliberate edit here.
[dev-dependencies]
# Property-based testing: generates random inputs and shrinks failures to a
# minimal case. https://github.com/proptest-rs/proptest
proptest = "=1.11.0"

# NEGATIVE PROOF, throwaway branch -- DO NOT MERGE.
# `time` 0.3.46 is affected by RUSTSEC-2026-0009 (stack exhaustion when parsing
# RFC 2822 input; patched in 0.3.47). This exists only to show that
# `cargo deny check` in scripts/check.sh actually fails the build on a real
# advisory, rather than being assumed to.
time = "=0.3.46"


[lib]
name = "atrium_resolver"
path = "src/lib.rs"

[[bin]]
name = "atrium-resolver"
path = "src/main.rs"
